services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cicd
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd
    ports:
      - "5432:5432"

  app:
    image: eclipse-temurin:17-jdk
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cicd
      SPRING_DATASOURCE_USERNAME: cicd
      SPRING_DATASOURCE_PASSWORD: cicd
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: ["./mvnw", "spring-boot:run"]
